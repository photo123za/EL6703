<html lang="th">
<head>

  <title>ระบบบริหารจัดการคำสั่งซื้อและคลังสินค้าหน้าร้าน (Point of Sale and Inventory Management System)</title>
  
  <!-- Google Fonts: Prompt & Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- Material Icons Font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />

  <!-- React 18 & ReactDOM 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>

  <!-- Emotion dependencies (Required for MUI v5) -->
  <script crossorigin src="https://unpkg.com/@emotion/react@11.11.4/dist/emotion-react.umd.min.js"></script>
  <script crossorigin src="https://unpkg.com/@emotion/styled@11.11.0/dist/emotion-styled.umd.min.js"></script>

  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>

  <!-- Material-UI v5 UMD Bundle -->
  <script crossorigin src="https://unpkg.com/@mui/material@5.15.14/umd/material-ui.production.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Prompt', 'Roboto', sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }
    .material-icons {
      font-family: 'Material Icons';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }
    /* Thermal Receipt Printing Styles */
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-receipt, #printable-receipt * {
        visibility: visible;
      }
      #printable-receipt {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 20px;
        background: white;
        color: black;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const {
      AppBar,
      Toolbar,
      Badge,
      Card,
      CardMedia,
      CardContent,
      CardActions,
      Table,
      TableHead,
      TableRow,
      TableCell,
      TableBody,
      TableContainer,
      Switch,
      TextField,
      IconButton,
      Snackbar,
      Alert,
      LinearProgress,
      Typography,
      Button,
      Box,
      Container,
      Grid,
      Dialog,
      DialogTitle,
      DialogContent,
      DialogActions,
      Chip,
      Divider,
      Paper,
      Tooltip,
      createTheme,
      ThemeProvider,
      CssBaseline
    } = MaterialUI;

    // Custom Theme with Prompt font
    const theme = createTheme({
      typography: {
        fontFamily: "'Prompt', 'Roboto', sans-serif",
        h6: { fontWeight: 600 },
        subtitle1: { fontWeight: 500 },
        button: { textTransform: 'none', fontWeight: 600 }
      },
      palette: {
        primary: {
          main: '#1e40af', // Deep Blue
          light: '#3b82f6',
          dark: '#1e3a8a'
        },
        secondary: {
          main: '#059669', // Emerald Green
          light: '#10b981',
          dark: '#047857'
        },
        warning: {
          main: '#ea580c'
        },
        background: {
          default: '#f8fafc',
          paper: '#ffffff'
        }
      },
      shape: {
        borderRadius: 12
      }
    });

    // Mock initial products data
    const initialProducts = [
      {
        id: 1,
        name: 'กาแฟอาราบิก้าคั่วสด (Arabica Coffee)',
        category: 'เครื่องดื่ม',
        price: 65,
        stock: 14,
        maxStock: 20,
        isAvailable: true,
        image: 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=500&q=80',
        description: 'กาแฟคั่วบดสดแท้ 100% หอมเข้ม กลมกล่อม'
      },
      {
        id: 2,
        name: 'ชาเขียวมัทฉะลาเต้ (Matcha Latte)',
        category: 'เครื่องดื่ม',
        price: 55,
        stock: 4, // < 5 ชิ้น (เตือนสินค้าใกล้หมด)
        maxStock: 15,
        isAvailable: true,
        image: 'https://images.unsplash.com/photo-1536256263959-770b48d82b0a?auto=format&fit=crop&w=500&q=80',
        description: 'มัทฉะแท้นำเข้าจากญี่ปุ่น รสนุ่มละมุนลิ้น'
      },
      {
        id: 3,
        name: 'แซนด์วิชแฮมชีสพรีเมียม (Ham & Cheese)',
        category: 'เบเกอรี่',
        price: 45,
        stock: 3, // < 5 ชิ้น (เตือนสินค้าใกล้หมด)
        maxStock: 10,
        isAvailable: true,
        image: 'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=500&q=80',
        description: 'ขนมปังโฮลวีตอบร้อน สอดไส้แฮมและเชดด้าชีสเยิ้มๆ'
      },
      {
        id: 4,
        name: 'ครัวซองต์เนยสดฝรั่งเศส (Butter Croissant)',
        category: 'เบเกอรี่',
        price: 40,
        stock: 9,
        maxStock: 15,
        isAvailable: true,
        image: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=500&q=80',
        description: 'ครัวซองต์หอมเนยแท้ กรอบนอกนุ่มในสไตล์ปารีส'
      },
      {
        id: 5,
        name: 'น้ำส้มคั้นสด 100% (Fresh Orange Juice)',
        category: 'เครื่องดื่ม',
        price: 50,
        stock: 18,
        maxStock: 20,
        isAvailable: true,
        image: 'https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=500&q=80',
        description: 'ส้มสายน้ำผึ้งคั้นสด สะอาด วิตามินซีสูง ไม่ผสมน้ำตาล'
      },
      {
        id: 6,
        name: 'เค้กช็อกโกแลตฟัดจ์หน้านิ่ม (Fudge Cake)',
        category: 'เบเกอรี่',
        price: 75,
        stock: 2, // < 5 ชิ้น (เตือนสินค้าใกล้หมด)
        maxStock: 10,
        isAvailable: true,
        image: 'https://images.unsplash.com/photo-1606890737304-57a1ca8a5b62?auto=format&fit=crop&w=500&q=80',
        description: 'ช็อกโกแลตแท้เข้มข้น เนื้อเค้กชุ่มฉ่ำ ละลายในปาก'
      },
      {
        id: 7,
        name: 'ชานมไข่มุกไต้หวันพ่นไฟ (Bubble Milk Tea)',
        category: 'เครื่องดื่ม',
        price: 60,
        stock: 12,
        maxStock: 25,
        isAvailable: true,
        image: 'https://images.unsplash.com/photo-1558857563-b37fe78a9c37?auto=format&fit=crop&w=500&q=80',
        description: 'ชานมหอมหวานกำลังดี ไข่มุกบราวน์ชูการ์เคี้ยวหนึบ'
      },
      {
        id: 8,
        name: 'มันฝรั่งทอดกรอบทรัฟเฟิล (Truffle Fries)',
        category: 'ของว่าง',
        price: 89,
        stock: 7,
        maxStock: 15,
        isAvailable: false, // ตัวอย่างสินค้าที่ปิดการขายเริ่มต้น
        image: 'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=500&q=80',
        description: 'เฟรนช์ฟรายส์ทอดกรอบ โรยเกลือหิมาลายันและซอสทรัฟเฟิล'
      }
    ];

    // Supported Discount Codes
    const DISCOUNT_CODES = {
      'SAVE10': { type: 'percent', value: 10, label: 'ลด 10%' },
      'SALE15': { type: 'percent', value: 15, label: 'ลด 15%' },
      'DISCOUNT50': { type: 'fixed', value: 50, label: 'ลด 50 บาท' },
      'VIP20': { type: 'percent', value: 20, label: 'ลด 20% (VIP)' }
    };

    function App() {
      // Products & Inventory State
      const [products, setProducts] = React.useState(initialProducts);
      // Cart items: [{ product, quantity }]
      const [cart, setCart] = React.useState([]);
      // Filter & Search
      const [selectedCategory, setSelectedCategory] = React.useState('ทั้งหมด');
      const [searchQuery, setSearchQuery] = React.useState('');
      const [onlyLowStock, setOnlyLowStock] = React.useState(false);
      // Discount Code
      const [discountInput, setDiscountInput] = React.useState('');
      const [appliedDiscount, setAppliedDiscount] = React.useState(null);
      // Cash input & Receipt
      const [cashReceived, setCashReceived] = React.useState('');
      const [receiptData, setReceiptData] = React.useState(null);
      const [isReceiptOpen, setIsReceiptOpen] = React.useState(false);
      // Snackbar Notification
      const [snackbar, setSnackbar] = React.useState({
        open: false,
        message: '',
        severity: 'success'
      });

      const showNotification = (message, severity = 'success') => {
        setSnackbar({ open: true, message, severity });
      };

      const handleCloseSnackbar = (event, reason) => {
        if (reason === 'clickaway') return;
        setSnackbar(prev => ({ ...prev, open: false }));
      };

      // Toggle Sale Status (ข้อกำหนด: Switch ควบคุมสถานะการขาย)
      const handleToggleStatus = (productId) => {
        setProducts(prevProducts =>
          prevProducts.map(p => {
            if (p.id === productId) {
              const newStatus = !p.isAvailable;
              showNotification(
                `สินค้า "${p.name}" ${newStatus ? 'เปิดจำหน่ายแล้ว' : 'ปิดการจำหน่ายชั่วคราว'}`,
                newStatus ? 'info' : 'warning'
              );
              return { ...p, isAvailable: newStatus };
            }
            return p;
          })
        );
      };

      // Add product to cart (ข้อกำหนด: CardActions -> เพิ่มลงตะกร้า)
      const handleAddToCart = (product) => {
        if (!product.isAvailable) {
          showNotification(`สินค้า "${product.name}" ปิดการจำหน่ายอยู่ในขณะนี้`, 'error');
          return;
        }

        if (product.stock <= 0) {
          showNotification(`สินค้า "${product.name}" หมดสต็อกแล้ว`, 'error');
          return;
        }

        const existingItem = cart.find(item => item.product.id === product.id);
        const currentQtyInCart = existingItem ? existingItem.quantity : 0;

        if (currentQtyInCart + 1 > product.stock) {
          showNotification(`สต็อกคงเหลือไม่เพียงพอ (มี ${product.stock} ชิ้น)`, 'warning');
          return;
        }

        if (existingItem) {
          setCart(cart.map(item =>
            item.product.id === product.id
              ? { ...item, quantity: item.quantity + 1 }
              : item
          ));
        } else {
          setCart([...cart, { product, quantity: 1 }]);
        }

        showNotification(`เพิ่ม "${product.name}" ลงในตะกร้าเรียบร้อยแล้ว`, 'success');
      };

      // Modify cart item quantity with IconButton (+ / -)
      const handleUpdateQuantity = (productId, delta) => {
        const item = cart.find(i => i.product.id === productId);
        if (!item) return;

        const currentProduct = products.find(p => p.id === productId);
        const newQty = item.quantity + delta;

        if (newQty <= 0) {
          handleRemoveFromCart(productId);
          return;
        }

        if (currentProduct && newQty > currentProduct.stock) {
          showNotification(`ไม่สามารถเพิ่มได้เกินสต็อกที่มี (${currentProduct.stock} ชิ้น)`, 'warning');
          return;
        }

        setCart(cart.map(i =>
          i.product.id === productId ? { ...i, quantity: newQty } : i
        ));
      };

      // Remove from cart with IconButton
      const handleRemoveFromCart = (productId) => {
        const removedItem = cart.find(i => i.product.id === productId);
        setCart(cart.filter(i => i.product.id !== productId));
        if (removedItem) {
          showNotification(`ลบ "${removedItem.product.name}" ออกจากตะกร้าแล้ว`, 'info');
        }
      };

      // Clear entire cart
      const handleClearCart = () => {
        setCart([]);
        setAppliedDiscount(null);
        setDiscountInput('');
        setCashReceived('');
        showNotification('ล้างรายการในตะกร้าทั้งหมดแล้ว', 'info');
      };

      // Apply Discount Code
      const handleApplyDiscount = (codeToApply = null) => {
        const code = (codeToApply || discountInput).trim().toUpperCase();
        if (!code) {
          showNotification('กรุณากรอกโค้ดส่วนลด', 'warning');
          return;
        }

        if (DISCOUNT_CODES[code]) {
          setAppliedDiscount({ code, ...DISCOUNT_CODES[code] });
          setDiscountInput(code);
          showNotification(`ใช้โค้ดส่วนลด "${code}" (${DISCOUNT_CODES[code].label}) สำเร็จ!`, 'success');
        } else {
          showNotification(`โค้ดส่วนลด "${code}" ไม่ถูกต้องหรือหมดอายุ`, 'error');
        }
      };

      const handleRemoveDiscount = () => {
        setAppliedDiscount(null);
        setDiscountInput('');
        showNotification('ยกเลิกโค้ดส่วนลดแล้ว', 'info');
      };

      // Calculations
      const subtotal = cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
      
      let discountAmount = 0;
      if (appliedDiscount && subtotal > 0) {
        if (appliedDiscount.type === 'percent') {
          discountAmount = (subtotal * appliedDiscount.value) / 100;
        } else if (appliedDiscount.type === 'fixed') {
          discountAmount = Math.min(appliedDiscount.value, subtotal);
        }
      }

      const netAfterDiscount = Math.max(0, subtotal - discountAmount);
      // VAT 7% คำนวณจากยอดหลังหักส่วนลด
      const vatAmount = netAfterDiscount * 0.07;
      // ราคารวมสุทธิทั้งหมด
      const grandTotal = netAfterDiscount + vatAmount;

      const totalItemsCount = cart.reduce((sum, item) => sum + item.quantity, 0);

      // Money change calculation
      const numCashReceived = parseFloat(cashReceived) || 0;
      const changeAmount = numCashReceived - grandTotal;
      const isCashSufficient = cashReceived !== '' && numCashReceived >= grandTotal && grandTotal > 0;

      // Checkout & Real-time stock deduction
      const handleCheckout = () => {
        if (cart.length === 0) {
          showNotification('ไม่มีสินค้าในตะกร้า', 'warning');
          return;
        }

        if (!isCashSufficient) {
          showNotification('กรุณาระบุจำนวนเงินที่รับให้ถูกต้องและเพียงพอกับยอดชำระ', 'error');
          return;
        }

        // Verify stock availability in real-time
        for (const item of cart) {
          const currentProduct = products.find(p => p.id === item.product.id);
          if (!currentProduct || currentProduct.stock < item.quantity) {
            showNotification(`สินค้า "${item.product.name}" สต็อกไม่พอสำหรับคำสั่งซื้อนี้`, 'error');
            return;
          }
        }

        // Real-time stock deduction!
        setProducts(prevProducts =>
          prevProducts.map(p => {
            const cartItem = cart.find(item => item.product.id === p.id);
            if (cartItem) {
              const updatedStock = Math.max(0, p.stock - cartItem.quantity);
              return {
                ...p,
                stock: updatedStock
              };
            }
            return p;
          })
        );

        // Prepare Receipt Data
        const receipt = {
          receiptNo: `POS-${Date.now().toString().slice(-6)}`,
          date: new Date().toLocaleString('th-TH', {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          }),
          items: cart.map(i => ({
            id: i.product.id,
            name: i.product.name,
            price: i.product.price,
            quantity: i.quantity,
            total: i.product.price * i.quantity
          })),
          subtotal,
          discountAmount,
          appliedDiscount,
          netAfterDiscount,
          vatAmount,
          grandTotal,
          cashReceived: numCashReceived,
          changeAmount
        };

        setReceiptData(receipt);
        setIsReceiptOpen(true);
        showNotification('ชำระเงินและตัดสต็อกสินค้าในระบบเรียลไทม์สำเร็จ!', 'success');

        // Clear cart after checkout
        setCart([]);
        setCashReceived('');
        setAppliedDiscount(null);
        setDiscountInput('');
      };

      // Reset initial demo data
      const handleResetStock = () => {
        setProducts(initialProducts);
        setCart([]);
        setAppliedDiscount(null);
        setCashReceived('');
        showNotification('รีเซ็ตสต็อกและข้อมูลสินค้าเป็นค่าเริ่มต้นแล้ว', 'info');
      };

      // Filter products
      const filteredProducts = products.filter(p => {
        const matchesCategory = selectedCategory === 'ทั้งหมด' || p.category === selectedCategory;
        const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              p.description.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesLowStock = !onlyLowStock || p.stock < 5;
        return matchesCategory && matchesSearch && matchesLowStock;
      });

      const categories = ['ทั้งหมด', 'เครื่องดื่ม', 'เบเกอรี่', 'ของว่าง'];

      return (
        <ThemeProvider theme={theme}>
          <CssBaseline />
          <Box sx={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
            
            {/* 1. Navigation & Header: AppBar, Toolbar, Badge */}
            <AppBar position="sticky" elevation={3} sx={{ backgroundColor: '#1e3a8a' }}>
              <Container maxWidth="xl">
                <Toolbar sx={{ display: 'flex', justifyContent: 'space-between', py: 1 }}>
                  <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5 }}>
                    <Box sx={{
                      width: 42,
                      height: 42,
                      borderRadius: '10px',
                      backgroundColor: '#3b82f6',
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      color: 'white'
                    }}>
                      <span className="material-icons">point_of_sale</span>
                    </Box>
                    <Box>
                      <Typography variant="h6" component="div" sx={{ fontWeight: 700, lineHeight: 1.2 }}>
                        ระบบบริหารจัดการคำสั่งซื้อและคลังสินค้าหน้าร้าน
                      </Typography>
                      <Typography variant="caption" sx={{ color: '#93c5fd' }}>
                        Point of Sale and Inventory Management System (งานที่ 2)
                      </Typography>
                    </Box>
                  </Box>

                  <Box sx={{ display: 'flex', alignItems: 'center', gap: 2 }}>
                    <Tooltip title="รีเซ็ตข้อมูลสินค้าและสต็อกเป็นค่าเริ่มต้น">
                      <Button
                        variant="outlined"
                        size="small"
                        onClick={handleResetStock}
                        startIcon={<span className="material-icons">restart_alt</span>}
                        sx={{ color: '#e0e7ff', borderColor: '#60a5fa', '&:hover': { borderColor: '#93c5fd' } }}
                      >
                        รีเซ็ตสต็อก
                      </Button>
                    </Tooltip>

                    {/* Badge แสดงจำนวนรายการในตะกร้า ตามข้อกำหนด */}
                    <Box sx={{ display: 'flex', alignItems: 'center', backgroundColor: 'rgba(255,255,255,0.12)', px: 2, py: 0.8, borderRadius: 2 }}>
                      <Badge badgeContent={totalItemsCount} color="error" showZero sx={{ mr: 1.5 }}>
                        <span className="material-icons" style={{ color: 'white' }}>shopping_cart</span>
                      </Badge>
                      <Box sx={{ display: { xs: 'none', sm: 'block' } }}>
                        <Typography variant="body2" sx={{ fontWeight: 600, color: 'white' }}>
                          ตะกร้าสินค้า
                        </Typography>
                        <Typography variant="caption" sx={{ color: '#93c5fd' }}>
                          {totalItemsCount} ชิ้น | ฿{grandTotal.toFixed(2)}
                        </Typography>
                      </Box>
                    </Box>
                  </Box>
                </Toolbar>
              </Container>
            </AppBar>

            {/* Main Content Area */}
            <Container maxWidth="xl" sx={{ mt: 3, mb: 5, flexGrow: 1 }}>
              <Grid container spacing={3}>
                
                {/* Left Column: Product Catalog & Inventory Management */}
                <Grid item xs={12} lg={7} xl={8}>
                  
                  {/* Search, Filter & Quick Stats Bar */}
                  <Paper elevation={1} sx={{ p: 2, mb: 3, borderRadius: 3 }}>
                    <Grid container spacing={2} alignItems="center">
                      <Grid item xs={12} md={5}>
                        <TextField
                          fullWidth
                          size="small"
                          placeholder="ค้นหาชื่อสินค้า หรือรายละเอียด..."
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                          InputProps={{
                            startAdornment: (
                              <span className="material-icons" style={{ color: '#94a3b8', marginRight: 8 }}>search</span>
                            ),
                            endAdornment: searchQuery ? (
                              <IconButton size="small" onClick={() => setSearchQuery('')}>
                                <span className="material-icons" style={{ fontSize: 18 }}>close</span>
                              </IconButton>
                            ) : null
                          }}
                        />
                      </Grid>

                      <Grid item xs={12} md={7}>
                        <Box sx={{ display: 'flex', gap: 1, flexWrap: 'wrap', alignItems: 'center', justifyContent: { xs: 'flex-start', md: 'flex-end' } }}>
                          {categories.map((cat) => (
                            <Chip
                              key={cat}
                              label={cat}
                              clickable
                              color={selectedCategory === cat ? 'primary' : 'default'}
                              variant={selectedCategory === cat ? 'filled' : 'outlined'}
                              onClick={() => setSelectedCategory(cat)}
                              sx={{ fontWeight: 500 }}
                            />
                          ))}
                          <Chip
                            icon={<span className="material-icons" style={{ fontSize: 16 }}>warning</span>}
                            label="สินค้าใกล้หมด (< 5)"
                            clickable
                            color={onlyLowStock ? 'warning' : 'default'}
                            variant={onlyLowStock ? 'filled' : 'outlined'}
                            onClick={() => setOnlyLowStock(!onlyLowStock)}
                            sx={{ fontWeight: 600 }}
                          />
                        </Box>
                      </Grid>
                    </Grid>

                    {/* Stock Alert Banner if any product < 5 */}
                    {products.some(p => p.stock < 5 && p.stock > 0) && (
                      <Box sx={{ mt: 2, p: 1.5, backgroundColor: '#fff7ed', borderRadius: 2, border: '1px solid #ffedd5', display: 'flex', alignItems: 'center', gap: 1 }}>
                        <span className="material-icons" style={{ color: '#ea580c' }}>notifications_active</span>
                        <Typography variant="body2" sx={{ color: '#9a3412', fontWeight: 500 }}>
                          แจ้งเตือนคลังสินค้า: มีสินค้าที่มีจำนวนคงเหลือน้อยกว่า 5 ชิ้น กรุณาวางแผนเติมสต็อกสินค้า
                        </Typography>
                      </Box>
                    )}
                  </Paper>

                  {/* Product Cards Grid: Card, CardMedia, CardContent, CardActions, LinearProgress, Switch */}
                  <Grid container spacing={2.5}>
                    {filteredProducts.map((product) => {
                      const isLowStock = product.stock < 5 && product.stock > 0;
                      const isOutOfStock = product.stock === 0;
                      const stockPercentage = Math.min(100, (product.stock / product.maxStock) * 100);
                      const cartItem = cart.find(i => i.product.id === product.id);
                      const inCartQty = cartItem ? cartItem.quantity : 0;
                      const isCartMax = inCartQty >= product.stock;

                      return (
                        <Grid item xs={12} sm={6} md={4} key={product.id}>
                          <Card
                            elevation={product.isAvailable ? 2 : 0}
                            sx={{
                              height: '100%',
                              display: 'flex',
                              flexDirection: 'column',
                              borderRadius: 3,
                              position: 'relative',
                              transition: 'transform 0.2s, box-shadow 0.2s',
                              border: isLowStock ? '2px solid #ea580c' : '1px solid #e2e8f0',
                              backgroundColor: product.isAvailable ? '#ffffff' : '#f8fafc',
                              opacity: product.isAvailable ? 1 : 0.75,
                              '&:hover': product.isAvailable ? {
                                transform: 'translateY(-4px)',
                                boxShadow: 6
                              } : {}
                            }}
                          >
                            {/* CardMedia: รูปภาพสินค้า */}
                            <Box sx={{ position: 'relative' }}>
                              <CardMedia
                                component="img"
                                height="150"
                                image={product.image}
                                alt={product.name}
                                sx={{
                                  objectFit: 'cover',
                                  filter: !product.isAvailable ? 'grayscale(80%)' : 'none'
                                }}
                              />
                              
                              {/* Category Badge over Image */}
                              <Chip
                                label={product.category}
                                size="small"
                                sx={{
                                  position: 'absolute',
                                  top: 10,
                                  left: 10,
                                  backgroundColor: 'rgba(255,255,255,0.92)',
                                  fontWeight: 600,
                                  fontSize: '0.75rem'
                                }}
                              />

                              {/* Status Badges */}
                              {isOutOfStock ? (
                                <Chip
                                  label="สินค้าหมดสต็อก"
                                  color="error"
                                  size="small"
                                  sx={{ position: 'absolute', top: 10, right: 10, fontWeight: 700 }}
                                />
                              ) : isLowStock ? (
                                <Chip
                                  icon={<span className="material-icons" style={{ fontSize: 14 }}>warning</span>}
                                  label={`ใกล้หมด (เหลือ ${product.stock})`}
                                  color="warning"
                                  size="small"
                                  sx={{ position: 'absolute', top: 10, right: 10, fontWeight: 700 }}
                                />
                              ) : null}
                            </Box>

                            {/* CardContent: ข้อมูลสินค้าและสถานะสต็อก */}
                            <CardContent sx={{ flexGrow: 1, pb: 1 }}>
                              <Typography variant="subtitle1" component="div" sx={{ fontWeight: 600, mb: 0.5, lineHeight: 1.3, minHeight: '2.6em' }}>
                                {product.name}
                              </Typography>
                              
                              <Typography variant="caption" sx={{ color: '#64748b', display: 'block', mb: 1.5, minHeight: '2.5em' }}>
                                {product.description}
                              </Typography>

                              <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', mb: 1.5 }}>
                                <Typography variant="h6" sx={{ color: '#1e40af', fontWeight: 700 }}>
                                  ฿{product.price.toFixed(2)}
                                </Typography>
                                <Typography variant="body2" sx={{ fontWeight: 600, color: isLowStock ? '#ea580c' : isOutOfStock ? '#dc2626' : '#334155' }}>
                                  คงเหลือ: {product.stock} ชิ้น
                                </Typography>
                              </Box>

                              {/* LinearProgress: แถบแสดงสัดส่วนสต็อกสินค้าคงเหลือ ตามข้อกำหนด */}
                              <Box sx={{ mb: 1.5 }}>
                                <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 0.5 }}>
                                  <Typography variant="caption" sx={{ color: '#64748b' }}>
                                    สัดส่วนสต็อกคงเหลือ
                                  </Typography>
                                  <Typography variant="caption" sx={{ fontWeight: 600, color: isLowStock ? '#ea580c' : '#059669' }}>
                                    {Math.round(stockPercentage)}%
                                  </Typography>
                                </Box>
                                <LinearProgress
                                  variant="determinate"
                                  value={stockPercentage}
                                  sx={{
                                    height: 8,
                                    borderRadius: 4,
                                    backgroundColor: '#e2e8f0',
                                    '& .MuiLinearProgress-bar': {
                                      backgroundColor: isOutOfStock
                                        ? '#ef4444'
                                        : isLowStock
                                        ? '#ea580c'
                                        : '#10b981'
                                    }
                                  }}
                                />
                              </Box>

                              {/* Switch: เปิด-ปิดสถานะการขาย ตามข้อกำหนด */}
                              <Box sx={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', pt: 0.5, borderTop: '1px dashed #e2e8f0' }}>
                                <Typography variant="caption" sx={{ fontWeight: 500, color: product.isAvailable ? '#059669' : '#94a3b8' }}>
                                  สถานะ: {product.isAvailable ? 'เปิดจำหน่าย' : 'ปิดจำหน่าย'}
                                </Typography>
                                <Tooltip title={product.isAvailable ? 'คลิกเพื่อปิดการขายสินค้านี้' : 'คลิกเพื่อเปิดการขายสินค้านี้'}>
                                  <Switch
                                    size="small"
                                    checked={product.isAvailable}
                                    onChange={() => handleToggleStatus(product.id)}
                                    color="success"
                                  />
                                </Tooltip>
                              </Box>
                            </CardContent>

                            {/* CardActions: ปุ่มเพิ่มสินค้าลงในตะกร้า */}
                            <CardActions sx={{ p: 2, pt: 0 }}>
                              <Button
                                fullWidth
                                variant={inCartQty > 0 ? "contained" : "outlined"}
                                color={isCartMax ? "inherit" : "primary"}
                                disabled={!product.isAvailable || isOutOfStock || isCartMax}
                                onClick={() => handleAddToCart(product)}
                                startIcon={<span className="material-icons">{inCartQty > 0 ? 'shopping_bag' : 'add_shopping_cart'}</span>}
                                sx={{ borderRadius: 2 }}
                              >
                                {!product.isAvailable
                                  ? 'งดจำหน่าย'
                                  : isOutOfStock
                                  ? 'สินค้าหมด'
                                  : isCartMax
                                  ? `ในตะกร้าครบสต็อก (${inCartQty})`
                                  : inCartQty > 0
                                  ? `เพิ่มอีก (+1) [ในตะกร้า ${inCartQty}]`
                                  : 'เพิ่มลงตะกร้า'}
                              </Button>
                            </CardActions>
                          </Card>
                        </Grid>
                      );
                    })}

                    {filteredProducts.length === 0 && (
                      <Grid item xs={12}>
                        <Paper sx={{ p: 5, textAlign: 'center', borderRadius: 3, backgroundColor: 'white' }}>
                          <span className="material-icons" style={{ fontSize: 48, color: '#94a3b8', marginBottom: 12 }}>inventory_2</span>
                          <Typography variant="h6" sx={{ color: '#64748b' }}>
                            ไม่พบสินค้าตามเงื่อนไขที่เลือก
                          </Typography>
                          <Button
                            variant="outlined"
                            sx={{ mt: 2 }}
                            onClick={() => {
                              setSelectedCategory('ทั้งหมด');
                              setSearchQuery('');
                              setOnlyLowStock(false);
                            }}
                          >
                            ล้างตัวกรองทั้งหมด
                          </Button>
                        </Paper>
                      </Grid>
                    )}
                  </Grid>
                </Grid>

                {/* Right Column: Shopping Cart & Checkout Panel */}
                <Grid item xs={12} lg={5} xl={4}>
                  <Paper elevation={3} sx={{ p: 2.5, borderRadius: 3, position: 'sticky', top: 85, backgroundColor: 'white' }}>
                    
                    {/* Cart Header */}
                    <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', mb: 2 }}>
                      <Box sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                        <span className="material-icons" style={{ color: '#1e40af' }}>shopping_cart_checkout</span>
                        <Typography variant="h6" sx={{ fontWeight: 700 }}>
                          รายการคำสั่งซื้อ
                        </Typography>
                        <Chip label={`${totalItemsCount} รายการ`} size="small" color="primary" sx={{ fontWeight: 600 }} />
                      </Box>
                      {cart.length > 0 && (
                        <Button
                          size="small"
                          color="error"
                          onClick={handleClearCart}
                          startIcon={<span className="material-icons" style={{ fontSize: 16 }}>delete_sweep</span>}
                        >
                          ล้างตะกร้า
                        </Button>
                      )}
                    </Box>

                    <Divider sx={{ mb: 2 }} />

                    {/* Table, TableHead, TableRow, TableCell: ตารางรายการในตะกร้า ตามข้อกำหนด */}
                    {cart.length === 0 ? (
                      <Box sx={{ py: 6, textAlign: 'center' }}>
                        <span className="material-icons" style={{ fontSize: 56, color: '#cbd5e1', marginBottom: 8 }}>remove_shopping_cart</span>
                        <Typography variant="body1" sx={{ color: '#64748b', fontWeight: 500 }}>
                          ยังไม่มีสินค้าในตะกร้า
                        </Typography>
                        <Typography variant="caption" sx={{ color: '#94a3b8' }}>
                          กรุณาเลือกรายการสินค้าจากทางด้านซ้ายเพื่อทำการขาย
                        </Typography>
                      </Box>
                    ) : (
                      <TableContainer sx={{ maxHeight: 280, mb: 2, overflowY: 'auto' }}>
                        <Table size="small" stickyHeader>
                          <TableHead>
                            <TableRow>
                              <TableCell sx={{ fontWeight: 700, backgroundColor: '#f8fafc' }}>สินค้า</TableCell>
                              <TableCell align="center" sx={{ fontWeight: 700, backgroundColor: '#f8fafc' }}>จำนวน</TableCell>
                              <TableCell align="right" sx={{ fontWeight: 700, backgroundColor: '#f8fafc' }}>รวม (฿)</TableCell>
                              <TableCell align="center" sx={{ fontWeight: 700, backgroundColor: '#f8fafc', width: 40 }}></TableCell>
                            </TableRow>
                          </TableHead>
                          <TableBody>
                            {cart.map((item) => {
                              const lineTotal = item.product.price * item.quantity;
                              const currentProduct = products.find(p => p.id === item.product.id);
                              const isMaxReached = currentProduct && item.quantity >= currentProduct.stock;

                              return (
                                <TableRow key={item.product.id} hover>
                                  <TableCell sx={{ py: 1 }}>
                                    <Typography variant="body2" sx={{ fontWeight: 600, lineHeight: 1.2 }}>
                                      {item.product.name}
                                    </Typography>
                                    <Typography variant="caption" sx={{ color: '#64748b' }}>
                                      @{item.product.price.toFixed(2)}
                                    </Typography>
                                  </TableCell>

                                  {/* IconButton: เพิ่ม/ลด รายการสินค้า ตามข้อกำหนด */}
                                  <TableCell align="center" sx={{ py: 1 }}>
                                    <Box sx={{ display: 'inline-flex', alignItems: 'center', border: '1px solid #e2e8f0', borderRadius: 1.5 }}>
                                      <IconButton
                                        size="small"
                                        onClick={() => handleUpdateQuantity(item.product.id, -1)}
                                        sx={{ p: 0.5 }}
                                      >
                                        <span className="material-icons" style={{ fontSize: 16 }}>remove</span>
                                      </IconButton>
                                      <Typography variant="body2" sx={{ px: 1, fontWeight: 700, minWidth: 24, textAlign: 'center' }}>
                                        {item.quantity}
                                      </Typography>
                                      <IconButton
                                        size="small"
                                        disabled={isMaxReached}
                                        onClick={() => handleUpdateQuantity(item.product.id, 1)}
                                        sx={{ p: 0.5 }}
                                      >
                                        <span className="material-icons" style={{ fontSize: 16 }}>add</span>
                                      </IconButton>
                                    </Box>
                                  </TableCell>

                                  <TableCell align="right" sx={{ py: 1, fontWeight: 600 }}>
                                    ฿{lineTotal.toFixed(2)}
                                  </TableCell>

                                  {/* IconButton: ลบ รายการสินค้า ตามข้อกำหนด */}
                                  <TableCell align="center" sx={{ py: 1 }}>
                                    <IconButton
                                      size="small"
                                      color="error"
                                      onClick={() => handleRemoveFromCart(item.product.id)}
                                      sx={{ p: 0.5 }}
                                    >
                                      <span className="material-icons" style={{ fontSize: 18 }}>delete_outline</span>
                                    </IconButton>
                                  </TableCell>
                                </TableRow>
                              );
                            })}
                          </TableBody>
                        </Table>
                      </TableContainer>
                    )}

                    <Divider sx={{ my: 1.5 }} />

                    {/* Transaction Calculation: ช่องใส่โค้ดส่วนลด (TextField) ตามข้อกำหนด */}
                    <Box sx={{ mb: 2 }}>
                      <Typography variant="caption" sx={{ fontWeight: 600, color: '#475569', display: 'block', mb: 0.5 }}>
                        โค้ดส่วนลด (Discount Code)
                      </Typography>
                      <Box sx={{ display: 'flex', gap: 1 }}>
                        <TextField
                          fullWidth
                          size="small"
                          placeholder="เช่น SAVE10, DISCOUNT50"
                          value={discountInput}
                          onChange={(e) => setDiscountInput(e.target.value.toUpperCase())}
                          disabled={cart.length === 0}
                          InputProps={{
                            startAdornment: (
                              <span className="material-icons" style={{ color: '#94a3b8', marginRight: 6, fontSize: 18 }}>local_offer</span>
                            )
                          }}
                        />
                        {appliedDiscount ? (
                          <Button
                            variant="outlined"
                            color="error"
                            size="small"
                            onClick={handleRemoveDiscount}
                            sx={{ minWidth: 70 }}
                          >
                            ยกเลิก
                          </Button>
                        ) : (
                          <Button
                            variant="contained"
                            color="secondary"
                            size="small"
                            disabled={cart.length === 0 || !discountInput.trim()}
                            onClick={() => handleApplyDiscount()}
                            sx={{ minWidth: 70 }}
                          >
                            ใช้โค้ด
                          </Button>
                        )}
                      </Box>

                      {/* Quick Code Chips */}
                      <Box sx={{ display: 'flex', gap: 0.8, mt: 1, flexWrap: 'wrap' }}>
                        {Object.entries(DISCOUNT_CODES).map(([code, info]) => (
                          <Chip
                            key={code}
                            label={`${code} (${info.label})`}
                            size="small"
                            variant={appliedDiscount?.code === code ? "filled" : "outlined"}
                            color={appliedDiscount?.code === code ? "secondary" : "default"}
                            clickable={cart.length > 0}
                            disabled={cart.length === 0}
                            onClick={() => handleApplyDiscount(code)}
                            sx={{ fontSize: '0.7rem' }}
                          />
                        ))}
                      </Box>
                    </Box>

                    {/* Financial Calculations Summary Box */}
                    <Paper variant="outlined" sx={{ p: 2, borderRadius: 2, backgroundColor: '#f8fafc', mb: 2 }}>
                      <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 0.8 }}>
                        <Typography variant="body2" sx={{ color: '#64748b' }}>ราคารวม (Subtotal):</Typography>
                        <Typography variant="body2" sx={{ fontWeight: 600 }}>฿{subtotal.toFixed(2)}</Typography>
                      </Box>

                      {appliedDiscount && (
                        <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 0.8, color: '#059669' }}>
                          <Typography variant="body2">
                            ส่วนลด ({appliedDiscount.code}):
                          </Typography>
                          <Typography variant="body2" sx={{ fontWeight: 600 }}>
                            -฿{discountAmount.toFixed(2)}
                          </Typography>
                        </Box>
                      )}

                      {/* VAT 7% Calculation ตามข้อกำหนด */}
                      <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 0.8 }}>
                        <Typography variant="body2" sx={{ color: '#64748b' }}>ภาษีมูลค่าเพิ่ม VAT (7%):</Typography>
                        <Typography variant="body2" sx={{ fontWeight: 600 }}>฿{vatAmount.toFixed(2)}</Typography>
                      </Box>

                      <Divider sx={{ my: 1 }} />

                      <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                        <Typography variant="subtitle1" sx={{ fontWeight: 700, color: '#1e3a8a' }}>
                          ยอดรวมสุทธิ (Grand Total):
                        </Typography>
                        <Typography variant="h5" sx={{ fontWeight: 800, color: '#1e40af' }}>
                          ฿{grandTotal.toFixed(2)}
                        </Typography>
                      </Box>
                    </Paper>

                    {/* Inputs & Controls: TextField ช่องใส่จำนวนเงินที่รับ ตามข้อกำหนด */}
                    <Box sx={{ mb: 2 }}>
                      <Typography variant="caption" sx={{ fontWeight: 600, color: '#475569', display: 'block', mb: 0.5 }}>
                        จำนวนเงินที่รับจากลูกค้า (Cash Received)
                      </Typography>
                      <TextField
                        fullWidth
                        size="small"
                        type="number"
                        placeholder="0.00"
                        value={cashReceived}
                        onChange={(e) => setCashReceived(e.target.value)}
                        disabled={cart.length === 0}
                        InputProps={{
                          startAdornment: (
                            <span className="material-icons" style={{ color: '#94a3b8', marginRight: 6, fontSize: 18 }}>payments</span>
                          ),
                          endAdornment: <Typography variant="body2" sx={{ color: '#94a3b8' }}>บาท</Typography>
                        }}
                      />

                      {/* Quick Cash Buttons */}
                      <Box sx={{ display: 'flex', gap: 0.8, mt: 1 }}>
                        {[
                          { label: 'พอดี', val: grandTotal },
                          { label: '100', val: 100 },
                          { label: '500', val: 500 },
                          { label: '1,000', val: 1000 }
                        ].map((btn) => (
                          <Button
                            key={btn.label}
                            size="small"
                            variant="outlined"
                            disabled={cart.length === 0 || (btn.label !== 'พอดี' && btn.val < grandTotal)}
                            onClick={() => setCashReceived(btn.val.toFixed(2))}
                            sx={{ flex: 1, py: 0.3, fontSize: '0.75rem' }}
                          >
                            {btn.label}
                          </Button>
                        ))}
                      </Box>

                      {/* คำนวณเงินทอน ตามข้อกำหนด */}
                      {cashReceived !== '' && grandTotal > 0 && (
                        <Box sx={{
                          mt: 1.5,
                          p: 1.5,
                          borderRadius: 2,
                          backgroundColor: isCashSufficient ? '#f0fdf4' : '#fef2f2',
                          border: `1px solid ${isCashSufficient ? '#bbf7d0' : '#fecaca'}`,
                          display: 'flex',
                          justifyContent: 'space-between',
                          alignItems: 'center'
                        }}>
                          <Typography variant="body2" sx={{ fontWeight: 600, color: isCashSufficient ? '#166534' : '#991b1b' }}>
                            {isCashSufficient ? 'เงินทอน (Change):' : 'เงินยังไม่ครบ (ขาดอีก):'}
                          </Typography>
                          <Typography variant="h6" sx={{ fontWeight: 800, color: isCashSufficient ? '#15803d' : '#dc2626' }}>
                            ฿{Math.abs(changeAmount).toFixed(2)}
                          </Typography>
                        </Box>
                      )}
                    </Box>

                    {/* Checkout Button */}
                    <Button
                      fullWidth
                      variant="contained"
                      size="large"
                      color="primary"
                      disabled={cart.length === 0 || !isCashSufficient}
                      onClick={handleCheckout}
                      startIcon={<span className="material-icons">receipt_long</span>}
                      sx={{ py: 1.4, borderRadius: 2.5, fontSize: '1rem', fontWeight: 700 }}
                    >
                      ชำระเงินและพิมพ์ใบเสร็จ
                    </Button>
                  </Paper>
                </Grid>
              </Grid>
            </Container>

            {/* Footer */}
            <Box sx={{ py: 2.5, textAlign: 'center', backgroundColor: '#e2e8f0', mt: 'auto' }}>
              <Typography variant="body2" sx={{ color: '#64748b' }}>
                งานที่ 2: ระบบบริหารจัดการคำสั่งซื้อและคลังสินค้าหน้าร้าน (Point of Sale and Inventory Management System)
              </Typography>
              <Typography variant="caption" sx={{ color: '#94a3b8' }}>
                พัฒนาด้วย React + Material-UI (MUI Components ครบถ้วนตามโจทย์)
              </Typography>
            </Box>

            {/* Feedback: Snackbar แจ้งเตือนเมื่อเพิ่มสินค้าลงตะกร้าสำเร็จ และเหตุการณ์ต่างๆ ตามข้อกำหนด */}
            <Snackbar
              open={snackbar.open}
              autoHideDuration={3500}
              onClose={handleCloseSnackbar}
              anchorOrigin={{ vertical: 'bottom', horizontal: 'center' }}
            >
              <Alert
                onClose={handleCloseSnackbar}
                severity={snackbar.severity}
                variant="filled"
                sx={{ width: '100%', borderRadius: 2, fontWeight: 500 }}
              >
                {snackbar.message}
              </Alert>
            </Snackbar>

            {/* Mini Receipt Dialog: ใบเสร็จรับเงินย่อ พร้อมตารางรายการ Table, TableHead, TableRow, TableCell ตามข้อกำหนด */}
            <Dialog
              open={isReceiptOpen}
              onClose={() => setIsReceiptOpen(false)}
              maxWidth="xs"
              fullWidth
              PaperProps={{
                sx: { borderRadius: 3, p: 1 }
              }}
            >
              <DialogTitle sx={{ textAlign: 'center', pb: 0 }}>
                <Box sx={{
                  width: 50,
                  height: 50,
                  borderRadius: '50%',
                  backgroundColor: '#dcfce7',
                  color: '#15803d',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  margin: '0 auto 8px auto'
                }}>
                  <span className="material-icons" style={{ fontSize: 32 }}>check_circle</span>
                </Box>
                <Typography variant="h6" sx={{ fontWeight: 700 }}>
                  ใบเสร็จรับเงินย่อ
                </Typography>
                <Typography variant="caption" sx={{ color: '#64748b' }}>
                  RECEIPT / TAX INVOICE (ABB)
                </Typography>
              </DialogTitle>

              <DialogContent sx={{ pt: 1 }} id="printable-receipt">
                <Paper variant="outlined" sx={{ p: 2, borderRadius: 2, backgroundColor: '#fafafa', fontFamily: 'monospace' }}>
                  <Box sx={{ textAlign: 'center', mb: 1.5 }}>
                    <Typography variant="subtitle2" sx={{ fontWeight: 700 }}>ร้านสมาร์ทมาร์ท POS ค้าปลีก</Typography>
                    <Typography variant="caption" sx={{ display: 'block', color: '#64748b' }}>เลขประจำตัวผู้เสียภาษี: 0105567012345</Typography>
                    <Typography variant="caption" sx={{ display: 'block', color: '#64748b' }}>โทร: 02-123-4567 | สาขา: 001</Typography>
                    <Divider sx={{ my: 1, borderStyle: 'dashed' }} />
                    <Box sx={{ display: 'flex', justifyContent: 'space-between' }}>
                      <Typography variant="caption">เลขที่: {receiptData?.receiptNo}</Typography>
                      <Typography variant="caption">{receiptData?.date}</Typography>
                    </Box>
                    <Divider sx={{ my: 1, borderStyle: 'dashed' }} />
                  </Box>

                  {/* Table ในใบเสร็จย่อ ตามข้อกำหนด */}
                  <Table size="small" sx={{ mb: 1 }}>
                    <TableHead>
                      <TableRow>
                        <TableCell sx={{ fontWeight: 700, fontSize: '0.75rem', p: 0.5 }}>รายการ</TableCell>
                        <TableCell align="center" sx={{ fontWeight: 700, fontSize: '0.75rem', p: 0.5 }}>จำนวน</TableCell>
                        <TableCell align="right" sx={{ fontWeight: 700, fontSize: '0.75rem', p: 0.5 }}>รวม</TableCell>
                      </TableRow>
                    </TableHead>
                    <TableBody>
                      {receiptData?.items.map((it) => (
                        <TableRow key={it.id}>
                          <TableCell sx={{ fontSize: '0.75rem', p: 0.5 }}>{it.name}</TableCell>
                          <TableCell align="center" sx={{ fontSize: '0.75rem', p: 0.5 }}>{it.quantity}</TableCell>
                          <TableCell align="right" sx={{ fontSize: '0.75rem', p: 0.5 }}>฿{it.total.toFixed(2)}</TableCell>
                        </TableRow>
                      ))}
                    </TableBody>
                  </Table>

                  <Divider sx={{ my: 1, borderStyle: 'dashed' }} />

                  <Box sx={{ fontSize: '0.8rem' }}>
                    <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 0.3 }}>
                      <Typography variant="caption">ราคารวม (Subtotal):</Typography>
                      <Typography variant="caption">฿{receiptData?.subtotal.toFixed(2)}</Typography>
                    </Box>

                    {receiptData?.discountAmount > 0 && (
                      <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 0.3, color: '#059669' }}>
                        <Typography variant="caption">ส่วนลด ({receiptData?.appliedDiscount?.code}):</Typography>
                        <Typography variant="caption">-฿{receiptData?.discountAmount.toFixed(2)}</Typography>
                      </Box>
                    )}

                    <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 0.3 }}>
                      <Typography variant="caption">ภาษีมูลค่าเพิ่ม VAT 7%:</Typography>
                      <Typography variant="caption">฿{receiptData?.vatAmount.toFixed(2)}</Typography>
                    </Box>

                    <Divider sx={{ my: 0.8 }} />

                    <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 0.5 }}>
                      <Typography variant="subtitle2" sx={{ fontWeight: 700 }}>ยอดรวมสุทธิ:</Typography>
                      <Typography variant="subtitle2" sx={{ fontWeight: 700, color: '#1e40af' }}>
                        ฿{receiptData?.grandTotal.toFixed(2)}
                      </Typography>
                    </Box>

                    <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 0.3 }}>
                      <Typography variant="caption">รับเงินสด:</Typography>
                      <Typography variant="caption">฿{receiptData?.cashReceived.toFixed(2)}</Typography>
                    </Box>

                    <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 0.3, fontWeight: 700 }}>
                      <Typography variant="caption" sx={{ fontWeight: 700 }}>เงินทอน:</Typography>
                      <Typography variant="caption" sx={{ fontWeight: 700, color: '#15803d' }}>
                        ฿{receiptData?.changeAmount.toFixed(2)}
                      </Typography>
                    </Box>
                  </Box>

                  <Divider sx={{ my: 1, borderStyle: 'dashed' }} />
                  <Typography variant="caption" sx={{ display: 'block', textAlign: 'center', color: '#64748b' }}>
                    *** ขอบคุณที่ใช้บริการ ***
                  </Typography>
                </Paper>
              </DialogContent>

              <DialogActions sx={{ px: 3, pb: 2, display: 'flex', justifyContent: 'space-between' }}>
                <Button
                  variant="outlined"
                  onClick={() => window.print()}
                  startIcon={<span className="material-icons">print</span>}
                >
                  พิมพ์ใบเสร็จ
                </Button>
                <Button
                  variant="contained"
                  color="primary"
                  onClick={() => setIsReceiptOpen(false)}
                >
                  ปิด / ทำรายการใหม่
                </Button>
              </DialogActions>
            </Dialog>

          </Box>
        </ThemeProvider>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
